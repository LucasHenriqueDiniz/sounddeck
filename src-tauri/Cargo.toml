[package]
name = "sounddeck"
version = "0.2.1"
description = "A sound scheme picker for Windows 10 and 11."
authors = ["Lucas Henrique Diniz Ostroski"]
edition = "2021"
default-run = "sounddeck"
license = "MIT"
repository = "https://github.com/LucasHenriqueDiniz/sounddeck"
homepage = "https://sounddeck.lucashdo.com"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sounddeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-registry = "0.6.1"
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

