<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chimer — make Windows sound like yours</title>
    <meta name="description" content="Chimer brings back the character of Windows sounds. Pick a pack, hear the preview, and make it yours in one click. Free and open source for Windows 10 and 11." />
    <link rel="icon" type="image/png" href="/img/chimer-icon.png" />
    <!--
      The body font, preloaded: it is needed for the first paint of the
      headline and would otherwise not be discovered until the stylesheet
      has been parsed. Only the latin subset — latin-ext is fetched on
      demand by unicode-range and preloading it would waste 18 KB on
      every visit.
    -->
    <link rel="preload" href="/fonts/dm-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Social and canonical tags are injected per page by scripts/prerender.mjs,
      not written here. Hardcoding them meant all 25 prerendered pages shipped
      the English home page's card, and og:image pointed at a relative "/og.png"
      that no crawler resolves. The dev server serves this file as-is, so link
      previews only exist in the built output — which is the only place they
      are ever fetched from.
    -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
